<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Kyllian — projets et hackathons</title>
  <desc id="desc">Bannière bleu nuit et lavande : Kyllian. Des idées qui prennent vie. Projets, hackathons, apprentissage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101729"/>
      <stop offset="1" stop-color="#1c2340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5a0ff"/>
      <stop offset="1" stop-color="#78e2d0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#bac6ef" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <path d="M 0 359 H 1280" stroke="url(#accent)" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="58" y="43" width="10" height="10" rx="3" fill="#91e3ce"/>
    <text x="82" y="54" fill="#bec8e3" font-size="17" font-weight="600" letter-spacing="3">PORTFOLIO GITHUB</text>
    <text x="54" y="168" fill="#f7f8ff" font-size="100" font-weight="700" letter-spacing="-5">Kyllian<tspan fill="#b9a8ff">.</tspan></text>
    <text x="59" y="221" fill="#d7def4" font-size="29">Des idées qui prennent vie.</text>
    <text x="60" y="299" fill="#aebbd7" font-size="18" letter-spacing="1.5">PROJETS / HACKATHONS / APPRENTISSAGE</text>
  </g>
  <g transform="translate(841 55)">
    <rect x="27" y="18" width="330" height="234" rx="17" fill="#131a2f" stroke="#465273" transform="rotate(6 192 135)"/>
    <rect width="330" height="234" rx="17" fill="#172039" stroke="#647199"/>
    <path d="M 0 46 H 330" stroke="#35425f"/>
    <circle cx="23" cy="24" r="5" fill="#b5a0ff"/>
    <circle cx="42" cy="24" r="5" fill="#7082a9"/>
    <circle cx="61" cy="24" r="5" fill="#78e2d0"/>
    <g font-family="Courier New, monospace" font-size="22">
      <text x="26" y="91" fill="#9daed2">&gt; une idée</text>
      <text x="26" y="134" fill="#bdaaff">&gt; construire</text>
      <text x="26" y="177" fill="#89e3ce">&gt; apprendre</text>
    </g>
    <rect x="27" y="198" width="13" height="3" fill="#89e3ce"/>
  </g>
</svg>
